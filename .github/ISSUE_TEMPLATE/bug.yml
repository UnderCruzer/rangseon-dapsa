name: 버그
description: 의도와 다르게 동작함
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. 데모 일정 "부산 당일치기" 실행
        2. 투어 중 3번 장소 클릭
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작 / 실제 동작
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: 환경
      multiple: true
      options: [웹 (데스크톱), 웹 (모바일 브라우저), Android 앱, 에뮬레이터]
  - type: textarea
    id: logs
    attributes:
      label: 콘솔 로그·스크린샷

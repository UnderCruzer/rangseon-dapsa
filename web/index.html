<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Trip3D</title>
</head>
<body>
  <div id="stage">
    <div id="map" class="view"></div>
    <div id="globe" class="view" hidden></div>
    <div id="vignette"></div>
  </div>

  <aside id="panel">
    <header class="brand">
      <span class="logo">◭</span>
      <div>
        <h1>Trip3D</h1>
        <p>한 줄로 떠나는 사전 답사</p>
      </div>
    </header>

    <form id="prompt-form">
      <textarea id="prompt" rows="2" placeholder="예) 부산 당일치기, 바다 위주로 걷고 야경으로 마무리"></textarea>
      <button id="go" type="submit">떠나기</button>
    </form>
    <div id="examples"></div>
    <p id="status" role="status"></p>

    <section id="trip" hidden>
      <div class="trip-head">
        <h2 id="trip-title"></h2>
        <p id="trip-summary"></p>
      </div>
      <ol id="stops"></ol>
    </section>
  </aside>

  <div id="hud">
    <div class="seg" id="mode-toggle" hidden>
      <button data-mode="satellite" class="on">위성 3D</button>
      <button data-mode="google">실사 3D</button>
    </div>
    <div class="clock"><span id="clock-icon">☀</span><span id="clock-time">--:--</span></div>
  </div>

  <article id="card" hidden>
    <div class="card-top">
      <span class="badge" id="card-index"></span>
      <span class="meta" id="card-meta"></span>
    </div>
    <h3 id="card-name"></h3>
    <p id="card-desc"></p>
    <p class="tip"><b>팁</b><span id="card-tip"></span></p>
    <p class="move" id="card-move"></p>
    <div class="controls">
      <button id="prev" aria-label="이전 장소">‹</button>
      <button id="play" aria-label="자동 투어">❚❚</button>
      <button id="next" aria-label="다음 장소">›</button>
      <button id="enter" class="enter">들어가기</button>
      <a id="roadview" target="_blank" rel="noopener">거리뷰 ↗</a>
    </div>
    <div class="progress"><i id="progress-bar"></i></div>
  </article>

  <section id="explore" hidden>
    <div class="explore-stage"></div>
    <header class="explore-top">
      <div>
        <h3 id="explore-name"></h3>
        <p id="explore-source"></p>
      </div>
      <button id="explore-close" aria-label="지도로 돌아가기">지도로 ✕</button>
    </header>
    <div id="explore-loading"><span id="explore-loading-text"></span></div>
    <div id="joystick" class="touch-only" aria-label="이동 조이스틱"><i></i></div>
    <p class="explore-hint">
      <span class="desktop-only"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 · <kbd>E</kbd><kbd>Q</kbd> 위·아래 · 드래그로 둘러보기 · <kbd>Shift</kbd> 빠르게 · <kbd>Esc</kbd> 나가기</span>
      <span class="touch-only">왼쪽 조이스틱으로 걷기 · 화면 드래그로 둘러보기</span>
    </p>
  </section>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
